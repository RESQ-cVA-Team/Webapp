name: Build Next.js Webapp Docker Image

on:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch, tag, or commit to build (optional; defaults to selected run ref)"
        required: false
        type: string
      push:
        description: "Push image to GHCR (false builds only)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.inputs.target_ref || github.ref }}
          submodules: recursive
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository name
        run: |
          REPO_NAME="${{ github.repository }}"
          echo "REPO_NAME_LC=${REPO_NAME,,}" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        env:
          TARGET_REF: ${{ github.event.inputs.target_ref }}
          PUSH_IMAGES: ${{ github.event.inputs.push || 'true' }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          WEBAPP_VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG_ARGS=()
          BUILD_ARGS=(
            --build-arg WEBAPP_VERSION=$WEBAPP_VERSION
            --build-arg WEBAPP_COMMIT_SHA=$GITHUB_SHA
            --build-arg WEBAPP_BUILD_DATE=$BUILD_DATE
          )
          
          BRANCH_NAME="${TARGET_REF:-${{ github.ref_name }}}"
          SAFE_BRANCH="$(echo "${BRANCH_NAME//\//-}" | tr '[:upper:]' '[:lower:]')"

          if [ -z "$SAFE_BRANCH" ]; then
            SAFE_BRANCH="manual"
          fi

          if [ "$SAFE_BRANCH" = "master" ]; then
            IMAGE_TAG="latest"
            IMAGE_SHA_TAG="master-$SHORT_SHA"
          elif [ "$SAFE_BRANCH" = "dev" ]; then
            IMAGE_TAG="dev"
            IMAGE_SHA_TAG="dev-$SHORT_SHA"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            IMAGE_TAG="$SAFE_BRANCH"
            IMAGE_SHA_TAG="$SAFE_BRANCH-$SHORT_SHA"
          else
            echo "Unsupported branch for docker publish: $SAFE_BRANCH" >&2
            exit 1
          fi

          BUILD_ARGS+=(--build-arg WEBAPP_IMAGE_TAG=$IMAGE_TAG)
          TAG_ARGS=(
            -t ghcr.io/$REPO_NAME_LC:$IMAGE_TAG
            -t ghcr.io/$REPO_NAME_LC:$IMAGE_SHA_TAG
          )

          DOCKER_OUTPUT_FLAG="--push"
          ATTEST_ARGS=(--provenance=mode=max --sbom=true)
          if [ "${PUSH_IMAGES:-true}" = "false" ]; then
            DOCKER_OUTPUT_FLAG="--load"
            ATTEST_ARGS=()
          fi

          docker buildx build \
            --platform linux/amd64 \
            --progress=plain \
            "${ATTEST_ARGS[@]}" \
            $DOCKER_OUTPUT_FLAG \
            "${BUILD_ARGS[@]}" \
            "${TAG_ARGS[@]}" \
            .
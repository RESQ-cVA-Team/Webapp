services:
  webshop:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    init: true
    ports:
      - "3000:3000"
    volumes:
      - ..:/workspace:cached
      - node_modules:/workspace/node_modules
      - pnpm-store:/workspace/.pnpm-store
    environment:
      USER_TOKEN_VAULT_BACKEND: redis
      USER_TOKEN_VAULT_REDIS_PREFIX: "cva:user-token:"
      RASA_URL_LIST: '[{"lang":"en","url":"http://host.docker.internal:5005"}]'
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  node_modules:
  pnpm-store: